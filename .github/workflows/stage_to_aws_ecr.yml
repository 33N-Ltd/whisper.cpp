name: Release Whisper.CPP

on:
  push:
    branches:
      - '33n-build-stage'
#    paths:
#      - '.devops/33n-build.Dockerfile'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v2

  release_tag_cpp:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      output: ${{ steps.tagging.outputs.new_tag }}

    name: Tag version CPP
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'

  build_make_and_push_image:
    needs: [release_tag_cpp]
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.build_step.outputs.short_sha }}
    name: Build & push image to ECR
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set Short SHA as Environment Variable
        run: echo "SHORT_SHA=087b44e" >> $GITHUB_ENV
      - name: Set Short SHA as Output Variable
        id: build_step
        run: echo "short_sha=${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT
        #run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        #build-087b44e-stage
#      - name: Build and Push
#        uses: kciter/aws-ecr-action@v5
#        env:
#          repo: whisper_cpp
#          build_github_token: ${{ secrets.GIT_TOKEN_CODE_DEPLOY }}
#        with:
#          access_key_id: ${{ secrets.AWS_PROD_ECR_AKI }}
#          secret_access_key: ${{ secrets.AWS_PROD_ECR_SAK }}
#          account_id: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
#          repo: ${{ env.repo }}
#          region: eu-west-2
#          tags: build-${{ env.SHORT_SHA }}-stage
#          dockerfile: .devops/33n-build.Dockerfile

  build_runtime_and_push_image:
    needs: [build_make_and_push_image]
    runs-on: ubuntu-latest

    name: Build & push image to ECR
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build and Push
        uses: kciter/aws-ecr-action@v5
        env:
          repo: whisper_cpp
          build_github_token: ${{ secrets.GIT_TOKEN_CODE_DEPLOY }}
          SHORT_SHA: ${{ needs.build_make_and_push_image.outputs.short_sha }}
        with:
          access_key_id: ${{ secrets.AWS_PROD_ECR_AKI }}
          secret_access_key: ${{ secrets.AWS_PROD_ECR_SAK }}
          account_id: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
          repo: ${{ env.repo }}
          region: eu-west-2
          tags: run-${{ env.SHORT_SHA }}-stage
          dockerfile: .devops/33n-run.Dockerfile
          extra_build_args: --build-arg BASE_CUDA_DEV_CONTAINER=${{ secrets.AWS_PROD_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com/${{ env.repo }}:build-${{ env.SHORT_SHA }}-stage


